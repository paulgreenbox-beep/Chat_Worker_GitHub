[package]
name = "cwg-github"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.89"

[dependencies]
cwg-protocol = { path = "../CWG_Protocol" }
cwg-security = { path = "../CWG_Security" }
